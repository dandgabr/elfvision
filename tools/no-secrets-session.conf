<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <listen>unix:runtime=yes</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*"/><allow receive_sender="*"/><allow own="*"/>
    <deny own="org.freedesktop.secrets"/>
    <deny send_destination="org.freedesktop.secrets"/>
    <deny own="org.freedesktop.impl.portal.desktop.oo7"/>
    <deny send_destination="org.freedesktop.impl.portal.desktop.oo7"/>
  </policy>
</busconfig>
